; Raw Presentation resources are loaded explicitly by the prototype, not imported as uassets.
; Keep normal Content monitoring and its inherited Localization exclusion.
[/Script/UnrealEd.EditorLoadingSavingSettings]
-AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*")))
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*",bInclude=False),(Wildcard="Presentation/*",bInclude=False)))
